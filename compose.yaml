services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inj
      POSTGRES_USER: inj
      POSTGRES_PASSWORD: inj
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inj -d inj"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - inj-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_INJ_AUTH_PORT: "28900"
      PN_INJ_SECURE_PORT: "28901"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_INJ_SECURE_HOST: ${PN_INJ_SECURE_HOST:-localhost}
      PN_INJ_POSTGRES_URI: postgres://inj:inj@postgres:5432/inj?sslmode=disable
      PN_INJ_KERBEROS_PASSWORD: ${PN_INJ_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_INJ_LOCAL_MODE=0
      # and providing the two NEX_* secrets (matching your account server).
      PN_INJ_LOCAL_MODE: ${PN_INJ_LOCAL_MODE:-1}
      PN_INJ_LEGACY_SIGNATURE: ${PN_INJ_LEGACY_SIGNATURE:-}
      PN_INJ_SETTINGS_PATH: /home/go/app/settings.json
      PN_INJ_NEX_TOKEN_AES_KEY: ${PN_INJ_NEX_TOKEN_AES_KEY:-}
      PN_INJ_NEX_PASSWORD_SECRET: ${PN_INJ_NEX_PASSWORD_SECRET:-}
      # Optional S3 for DataStore object uploads (downloads work without it).
      PN_S3_ENDPOINT: ${PN_S3_ENDPOINT:-}
      PN_S3_ACCESS_KEY: ${PN_S3_ACCESS_KEY:-}
      PN_S3_SECRET_KEY: ${PN_S3_SECRET_KEY:-}
      PN_S3_BUCKET: ${PN_S3_BUCKET:-inj-datastore}
    ports:
      - "28900:28900/udp"
      - "28901:28901/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  inj-postgres:
